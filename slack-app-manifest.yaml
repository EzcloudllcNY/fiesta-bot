# Paste into https://api.slack.com/apps → Create New App → From an app manifest.
#
# After creating the app:
#   1. Basic Information → App-Level Tokens → generate one with `connections:write`.
#      That is SLACK_APP_TOKEN.
#   2. Install to Workspace → copy the Bot User OAuth Token. That is SLACK_BOT_TOKEN.
#   3. Invite the bot to the celebration channel, or it cannot post there.
display_information:
  name: Fiesta
  description: Keeps track of team birthdays and makes sure nobody is forgotten.
  background_color: "#2d1b3d"

features:
  bot_user:
    display_name: Fiesta
    always_online: true
  slash_commands:
    - command: /birthday
      description: Add, change, or remove your birthday
      should_escape: false

oauth_config:
  scopes:
    bot:
      - chat:write # post the celebration and the DMs
      - im:write # open a DM conversation with a member
      - users:read # read the roster for the daily sync
      - commands # receive /birthday

settings:
  event_subscriptions:
    bot_events:
      - team_join # ask new members for their birthday
      - user_change # keep display names and deactivations current
  interactivity:
    is_enabled: true # buttons and the birthday modal
  # Socket Mode: the app dials out to Slack, so no public URL is needed.
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
